name: Generate sample targets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Target name from the sample descriptor, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Check bundle lifecycle orchestration
        run: uv run python -m unittest discover -s tests -p test_databricks_jobs.py
      - name: Generate and check targets
        env:
          SELECTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: uv run python scripts/check_generation.py --target "$SELECTED_TARGET"
