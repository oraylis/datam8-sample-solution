name: Sample integration tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: Integration target name, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: sample-integration-environment
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-24.04
    environment: sample-integration
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: databricks/setup-cli@main
      - run: uv sync --frozen
      - name: Run selected integration targets
        env:
          SELECTED_TARGET: ${{ inputs.target }}
        run: uv run python scripts/run_integration_tests.py --target "$SELECTED_TARGET"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-reports
          path: Output/e2e-test-reports/
          if-no-files-found: ignore
