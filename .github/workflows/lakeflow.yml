name: Lakeflow generation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend:
          - d53fd5561a254385412fb109585475cbba00287d
          - 3e3d89cdf404d1d4d2335c7736a85427f0f07931
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The backend commit also pins its datam8-model submodule revision.
      - run: python -m pip install "datam8 @ git+https://github.com/oraylis/datam8-generator@${{ matrix.backend }}"
      - run: python scripts/check_lakeflow.py --baseline-ref origin/main
