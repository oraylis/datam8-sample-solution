[project]
name = "datam8-sample-solution"
version = "2.1.0"
description = "Public AdventureWorks metadata and local generation example"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datam8[sql]",
  "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/oraylis/datam8-sample-solution"

[tool.uv.sources]
datam8 = { git = "https://github.com/oraylis/datam8-cli", rev = "85ff50de3c7fc8e20abd4edd021d63df02c31b91" }

[tool.ruff]
line-length = 120
fix = false
builtins = ["spark", "sqlContext", "dbutils", "Catalog", "Table"]

[tool.ruff.lint]
select = ["E", "F"]
unfixable = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
venvPath = ".venv"
venv = "."
