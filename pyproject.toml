[project]
name = "datam8-sample-solution"
version = "2.0.0-beta.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datam8",
]

[project.urls]
Homepage = "https://github.com/oraylis/datam8-sample-solution"

[tool.uv.sources]
datam8 = { git = "https://github.com/oraylis/datam8-generator", tag = "v2.0.0-beta.1" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "E4", "E7", "E9", "W", "F", "Q", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
venvPath = ".venv"
venv = "."
