[project]
name = "datam8-sample-solution"
version = "2.0.0-beta.1"
description = "DataM8 Sample Solution"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "databricks-connect ~=17.3.0",
  "datam8[sql,api]",
]

[project.urls]
Homepage = "https://github.com/oraylis/datam8-sample-solution"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "E4", "E7", "E9", "W", "F", "Q", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
[[tool.uv.sources.datam8]]
git = "https://github.com/oraylis/datam8-generator"
branch = "main"
# tag = "v2.0.0-beta.1"

[language-server.jinja-lsp.config]
lang = "python"