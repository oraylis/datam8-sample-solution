bundle:
  name: datam8_sample_lake
include:
- bundle.targets.yml
- generated/schemas/*.yml
- generated/clusters/*.yml
- generated/jobs/*.yml
- generated/jobs/*/*.yml
- generated/jobs/*/*/*/*.yml
sync:
  include:
  - generated/**
  - utils/**
variables:
  catalog_name: {}
  environment:
    default: dev
  owner: {}
  deploy_service_principal: {}
  run_as_service_principal: {}
  connection_prefix:
    default: sample_
  date_start:
    default: "2000-01-01"
  date_end:
    default: "2030-12-31"
  unpause_schedules:
    default: PAUSED
  notebook_path:
    default: files/generated/notebooks
permissions:
- service_principal_name: ${var.deploy_service_principal}
  level: CAN_MANAGE
- service_principal_name: ${var.run_as_service_principal}
  level: CAN_RUN
