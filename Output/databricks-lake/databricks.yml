# This is a Databricks asset bundle definition for automation_smaple_solution.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: automation_sample_solution

resources:
  catalogs:
    main_catalog:
      name: ${var.catalog_name}

include:
  - generated/schemas/*.yml
  - generated/clusters/*.yml
  - generated/jobs/*.yml  # top-level
  - generated/jobs/*/*.yml  # layer-level
  - generated/jobs/*/*/*/*.yml  # product/module-level

sync:
  include:
    - utils/

# all defaults are preset with dev values
variables:
  notebook_path:
    description: Location of the notebooks within the bundle
    default: 'files/generated/notebooks'
  catalog_name:
    description: The name of the unity catalog
    default: datam8_campus_dev_fk
  schema_prefix:
    description: Prefix applied to schema names in notebooks
    default: ""
  environment:
    description: The logical environment
    default: dev
  owner:
    description: The default owner of all created databricks objects
    default: teilnehmer
  unpause_schedules:
    description: Override the default schedule status
    default: PAUSED
  permission_group_name:
      description: Group name for general permissions on cluster and jobs
      default: teilnehmer

targets:
  # The 'dev' target, used for development. This is the default.
  dev-personal:
    # We use 'mode: development' to indicate this is a personal development copy:
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default
    # - The 'development' mode is used for Delta Live Tables pipelines
    mode: development
    default: true
    variables:
      schema_prefix: "dev_${workspace.current_user.short_name}_"
    workspace:
      host: https://adb-1451794858897186.6.azuredatabricks.net
      root_path: ~/.bundle/${bundle.name}/${bundle.target}

  dev:
    presets:
      name_prefix: "[${bundle.target}] "      # prefix all resource names with testing_
      pipelines_development: true  # set development to true for pipelines
      trigger_pause_status: PAUSED # set pause_status to PAUSED for all triggers and schedules
      jobs_max_concurrent_runs: 10 # set max_concurrent runs to 10 for all jobs
      tags:
        dev: ${bundle.target}
    workspace:
      host: https://adb-1451794858897186.6.azuredatabricks.net
      root_path: /etl/${bundle.name}/${bundle.target}

  # INFO: add more targets if necessary

  # The 'prod' target, used for production deployments.
  prod:
    # We use 'mode: production' to indicate this is a production deployment.
    # Doing so enables strict verification of the settings below.
    mode: production
    variables:
      environment: prod
      catalog_name: datam8_campus_${bundle.target}
      unpause_schedules: UNPAUSED
      permission_group_name: trainer
    workspace:
      host: https://adb-1451794858897186.6.azuredatabricks.net
      root_path: /etl/${bundle.name}/${bundle.target}

