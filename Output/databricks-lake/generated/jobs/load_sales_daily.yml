resources:
  jobs:
    Load_sales_daily:
      name: Load Sales (Daily)
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      permissions:
        - service_principal_name: ${var.run_as_service_principal}
          level: "CAN_MANAGE_RUN"
        - group_name: ${var.permission_group_name}
          level: "CAN_MANAGE_RUN"
      job_clusters:
        - job_cluster_key: cluster_small
          new_cluster: ${var.cluster_small}

      tasks:
        - task_key: Start_Load
          notebook_task:
            notebook_path: ${workspace.root_path}/files/utils/Start_Load

            base_parameters:
              target_zone: sales_daily

            source: WORKSPACE
          job_cluster_key: cluster_small
          libraries:
            - maven:
                coordinates: com.oracle.database.jdbc:ojdbc10:19.29.0.0

        - task_key: raw_customer_customer_de
          depends_on:
            - task_key: Start_Load
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/dml/Sales/Customer/Customer_DE
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          libraries:
            - whl: ${workspace.root_path}/files/connectors/datam8_plugin_sqlserver-0.1.0-py3-none-any.whl
          job_cluster_key: cluster_small

        - task_key: raw_customer_customer_en
          depends_on:
            - task_key: Start_Load
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/dml/Sales/Customer/Customer_EN
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
