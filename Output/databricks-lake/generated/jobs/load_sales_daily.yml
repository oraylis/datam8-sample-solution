          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/dml/Sales/Customer/CustomerAddress
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          libraries:
            - whl: ${workspace.root_path}/files/connectors/datam8_plugin_sqlserver-0.1.0-py3-none-any.whl
          job_cluster_key: cluster_small

        - task_key: raw_dimtime_dimtime
          depends_on:
            - task_key: Start_Load
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/dml/Sales/Customer/dimtime
