resources:
  jobs:
    Load_All_Tables:
      name: Load All Tables
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      permissions:
        - service_principal_name: ${var.run_as_service_principal}
          level: "CAN_MANAGE_RUN"
        - group_name: ${var.permission_group_name}
          level: "CAN_MANAGE_RUN"

      tasks:

        - task_key: Load_sales_daily
          run_job_task:
            job_id: ${resources.jobs.Load_sales_daily.id}


        - task_key: Load_sales_weekly
          run_job_task:
            job_id: ${resources.jobs.Load_sales_weekly.id}

          depends_on:

            - task_key: Load_sales_daily


