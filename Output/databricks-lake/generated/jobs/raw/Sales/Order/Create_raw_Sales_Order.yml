resources:
  jobs:
    Create_raw_Sales_Order:
      name: Create Raw Data Layer Order
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      permissions:
        - service_principal_name: ${var.run_as_service_principal}
          level: "CAN_MANAGE_RUN"
        - group_name: ${var.permission_group_name}
          level: "CAN_MANAGE_RUN"
      job_clusters:
        - job_cluster_key: cluster_extra_small
          new_cluster: ${var.cluster_extra_small}
      tasks:

        - task_key: raw_sales_order_salesorderdetail
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/ddl/Sales/Order/SalesOrderDetail
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: raw_sales_order_salesorderheader
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/ddl/Sales/Order/SalesOrderHeader
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small
