resources:
  jobs:
    Create_raw_Sales_Customer:
      name: Create Raw Data Layer Customer
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      permissions:
        - service_principal_name: ${var.run_as_service_principal}
          level: "CAN_MANAGE_RUN"
        - group_name: ${var.permission_group_name}
          level: "CAN_MANAGE_RUN"
      job_clusters:
        - job_cluster_key: cluster_extra_small
          new_cluster: ${var.cluster_extra_small}
      tasks:

        - task_key: raw_sales_customer_customer_de
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/ddl/Sales/Customer/Customer_DE
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: raw_sales_customer_customer_en
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/ddl/Sales/Customer/Customer_EN
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: raw_sales_customer_customeraddress
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/ddl/Sales/Customer/CustomerAddress
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: raw_sales_customer_dimtime
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/raw/ddl/Sales/Customer/dimtime
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small
