resources:
  jobs:
    Create_stage_Sales_Customer:
      name: ${var.job_name_prefix}Create Staging Data Layer Sales Customer
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      permissions:
        - group_name: ${var.permission_group_name}
          level: "CAN_MANAGE_RUN"
      job_clusters:
        - job_cluster_key: cluster_extra_small
          new_cluster: ${var.cluster_extra_small}
      tasks:

        - task_key: stage_sales_customer_customer
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/010-Stage/ddl/Sales/Customer/Customer
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: stage_sales_customer_customeraddress
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/010-Stage/ddl/Sales/Customer/CustomerAddress
            source: WORKSPACE
          job_cluster_key: cluster_extra_small
