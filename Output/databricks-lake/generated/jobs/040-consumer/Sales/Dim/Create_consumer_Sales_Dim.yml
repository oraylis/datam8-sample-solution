resources:
  jobs:
    Create_consumer_Sales_Dim:
      name: Create Consumer Tabular Layer Sales Dim
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      permissions:
        - service_principal_name: ${var.run_as_service_principal}
          level: "CAN_MANAGE_RUN"
        - group_name: ${var.permission_group_name}
          level: "CAN_MANAGE_RUN"
      job_clusters:
        - job_cluster_key: cluster_extra_small
          new_cluster: ${var.cluster_extra_small}
      tasks:

        - task_key: consumer_sales_dim_customer
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/040-Consumer/ddl/Sales/Dim/Customer
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: consumer_sales_dim_date
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/040-Consumer/ddl/Sales/Dim/Date
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small

        - task_key: consumer_sales_dim_measure
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.notebook_path}/040-Consumer/ddl/Sales/Dim/Measure
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE
          job_cluster_key: cluster_extra_small
