resources:
  jobs:
    Lakeflow_Load_daily:
      name: ${var.job_name_prefix}Lakeflow Load daily
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_prefix
          default: ${var.lakeflow_schema_prefix}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      job_clusters:
        - job_cluster_key: cluster_small
          new_cluster: ${var.cluster_small}

      schedule:
        quartz_cron_expression: 49 0 1 * * ?
        timezone_id: UTC
        pause_status: ${var.unpause_schedules}

      tasks:
        - task_key: Start_Load
          notebook_task:
            notebook_path: ${workspace.root_path}/files/utils/Start_Load
            source: WORKSPACE
          job_cluster_key: cluster_small

        - task_key: lakeflow_external_sales_order_salesorderheader
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_order_salesorderheader.id}

        - task_key: lakeflow_external_sales_order_salesorderdetail
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_order_salesorderdetail.id}

        - task_key: lakeflow_external_sales_other_address
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_other_address.id}

        - task_key: lakeflow_external_sales_product_productdescription
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_product_productdescription.id}

        - task_key: lakeflow_external_sales_product_productcategory
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_product_productcategory.id}

        - task_key: lakeflow_external_sales_product_productmodel
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_product_productmodel.id}

        - task_key: lakeflow_external_sales_product_product
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_product_product.id}

        - task_key: lakeflow_external_sales_customer_customeraddress
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_customer_customeraddress.id}

        - task_key: lakeflow_external_sales_customer_customer_de
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_customer_customer_de.id}

        - task_key: lakeflow_external_sales_customer_customer_en
          depends_on:
            - task_key: Start_Load
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_external_sales_customer_customer_en.id}


        - task_key: lakeflow_entity_010_stage_sales_order_salesorderheader
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_order_salesorderheader
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_order_salesorderheader.id}

        - task_key: lakeflow_entity_010_stage_sales_order_salesorderdetail
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_order_salesorderdetail
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_order_salesorderdetail.id}

        - task_key: lakeflow_entity_010_stage_sales_other_address
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_other_address
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_other_address.id}

        - task_key: lakeflow_entity_010_stage_sales_product_productdescription
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_product_productdescription
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_product_productdescription.id}

        - task_key: lakeflow_entity_010_stage_sales_product_productcategory
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_product_productcategory
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_product_productcategory.id}

        - task_key: lakeflow_entity_010_stage_sales_product_productmodel
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_product_productmodel
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_product_productmodel.id}

        - task_key: lakeflow_entity_010_stage_sales_product_product
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_product_product
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_product_product.id}

        - task_key: lakeflow_entity_010_stage_sales_customer_customeraddress
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_customer_customeraddress
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_customer_customeraddress.id}

        - task_key: lakeflow_entity_010_stage_sales_customer_customer
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_external_sales_customer_customer_de
            - task_key: lakeflow_external_sales_customer_customer_en
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_entity_stage_sales_customer_customer.id}

        - task_key: lakeflow_delta_020_core_sales_other_address
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_entity_010_stage_sales_other_address
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.lakeflow_output_path}/notebooks/020-Core/dml/Sales/Other/Address
            source: WORKSPACE
          job_cluster_key: cluster_small

        - task_key: lakeflow_delta_020_core_sales_customer_customeraddress
          depends_on:
            - task_key: Start_Load
            - task_key: lakeflow_entity_010_stage_sales_customer_customeraddress
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.lakeflow_output_path}/notebooks/020-Core/dml/Sales/Customer/CustomerAddress
            source: WORKSPACE
          job_cluster_key: cluster_small

        - task_key: lakeflow_delta_030_curated_sales_customer_dimdate
          depends_on:
            - task_key: Start_Load
          notebook_task:
            notebook_path: ${workspace.root_path}/${var.lakeflow_output_path}/notebooks/030-Curated/dml/Sales/Customer/DimDate
            source: WORKSPACE
          job_cluster_key: cluster_small


        - task_key: Complete_Load
          depends_on:
            - task_key: lakeflow_entity_010_stage_sales_order_salesorderheader
            - task_key: lakeflow_entity_010_stage_sales_order_salesorderdetail
            - task_key: lakeflow_entity_010_stage_sales_other_address
            - task_key: lakeflow_entity_010_stage_sales_product_productdescription
            - task_key: lakeflow_entity_010_stage_sales_product_productcategory
            - task_key: lakeflow_entity_010_stage_sales_product_productmodel
            - task_key: lakeflow_entity_010_stage_sales_product_product
            - task_key: lakeflow_entity_010_stage_sales_customer_customeraddress
            - task_key: lakeflow_entity_010_stage_sales_customer_customer
            - task_key: lakeflow_delta_020_core_sales_other_address
            - task_key: lakeflow_delta_020_core_sales_customer_customeraddress
            - task_key: lakeflow_delta_030_curated_sales_customer_dimdate
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ${workspace.root_path}/files/utils/Complete_Load
            source: WORKSPACE
          job_cluster_key: cluster_small
