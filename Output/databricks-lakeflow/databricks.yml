bundle:
  name: datam8_sample_lakeflow
sync:
  include:
  - generated/**
variables:
  catalog_name: {}
  environment:
    default: dev
  owner: {}
  deploy_service_principal: {}
  run_as_service_principal: {}
  ingestion_permissions:
    description: Explicit ingestion ACL, preserving existing UC pipeline ownership
    type: complex
    default:
    - service_principal_name: ${var.deploy_service_principal}
      level: IS_OWNER
    - service_principal_name: ${var.run_as_service_principal}
      level: CAN_RUN
  connection_prefix:
    default: sample_
  sqlserver_connection: {}
  oracle_connection: {}
  mysql_connection: {}
  postgresql_connection: {}
  date_start:
    default: "2000-01-01"
  date_end:
    default: "2030-12-31"
  unpause_schedules:
    default: PAUSED
  lakeflow_output_path:
    default: files/generated
  lakeflow_schema_prefix:
    default: ''
  job_name_prefix:
    default: ''
  pipeline_full_refresh:
    default: false
include:
- bundle.targets.yml
- generated/schemas/*.yml
- generated/jobs/*.yml
- generated/pipelines/*.yml
