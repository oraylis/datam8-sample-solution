resources:
  pipelines:
    lakeflow_external_sales_other_address:
      name: ${var.job_name_prefix}Lakeflow External Sales_Other_Address
      catalog: ${var.catalog_name}
      schema: ${var.lakeflow_schema_prefix}raw
      serverless: true
      channel: PREVIEW
      configuration:
        catalog_name: ${var.catalog_name}
        schema_prefix: ${var.lakeflow_schema_prefix}
      ingestion_definition:
        connection_name: adventureworks
        objects:
          - table:
              source_catalog: AdventureWorks
              source_schema: SalesLT
              source_table: Address
              table_configuration:
                primary_keys:
                  - AddressID
                query_based_connector_config:
                  cursor_columns:
                    - ModifiedDate
              destination_catalog: ${var.catalog_name}
              destination_schema: ${var.lakeflow_schema_prefix}raw
              destination_table: Sales_Other_Address