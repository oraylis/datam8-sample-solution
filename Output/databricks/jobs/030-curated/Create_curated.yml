resources:
  jobs:
    Create_curated_tables:
      name: "[${var.environment}] Create Curated Analytics Layer Tables"
      tags:
        platform: databricks-lake
      max_concurrent_runs: 1
      parameters:
        - name: env
          default: ${var.environment}
        - name: date_start
          default: ${var.date_start}
        - name: date_end
          default: ${var.date_end}
        - name: connection_prefix
          default: ${var.connection_prefix}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: owner
          default: ${var.owner}
        - name: workspace_host
          default: ${workspace.host}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"


      job_clusters:

        - job_cluster_key: cluster_extra_small
          new_cluster: ${var.cluster_extra_small}


      tasks:

        - task_key: curated_masterdata_calendar_dimdate

          notebook_task:
            notebook_path: ${workspace.file_path}/output/databricks/notebooks/030-Curated/ddl/MasterData/Calendar/DimDate
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE

          job_cluster_key: cluster_extra_small


        - task_key: curated_masterdata_customer_dimcustomer

          notebook_task:
            notebook_path: ${workspace.file_path}/output/databricks/notebooks/030-Curated/ddl/MasterData/Customer/DimCustomer
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE

          job_cluster_key: cluster_extra_small


        - task_key: curated_sales_orders_factsalesorder

          notebook_task:
            notebook_path: ${workspace.file_path}/output/databricks/notebooks/030-Curated/ddl/Sales/Orders/FactSalesOrder
            base_parameters:
              replication_integration_status_id: '1'
              execution_status_id: '1'
            source: WORKSPACE

          job_cluster_key: cluster_extra_small

