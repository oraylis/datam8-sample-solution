resources:
  jobs:
    Create_gold_tables:
      name: ${var.job_name_prefix}Create gold
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: owner
          default: ${var.owner}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      tasks:

        - task_key: Create_gold_Sales_Customer
          run_job_task:
            job_id: ${resources.jobs.Create_gold_Sales_Customer.id}

