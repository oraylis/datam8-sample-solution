resources:
  jobs:
    Create_All_Tables:
      name: ${var.job_name_prefix}Create All Tables
      max_concurrent_runs: 1
      parameters:
        - name: environment
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      tasks:

        - task_key: Create_raw_tables

          run_job_task:
            job_id: ${resources.jobs.Create_raw_tables.id}



        - task_key: Create_bronze_tables

          run_job_task:
            job_id: ${resources.jobs.Create_bronze_tables.id}



        - task_key: Create_silver_tables

          run_job_task:
            job_id: ${resources.jobs.Create_silver_tables.id}



        - task_key: Create_gold_tables

          run_job_task:
            job_id: ${resources.jobs.Create_gold_tables.id}


